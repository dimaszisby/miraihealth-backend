name: Promote Dev to Staging

on:
  workflow_run:
    workflows:
      - Lakira Backend CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-staging-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  open_promotion_pr:
    name: Open Dev -> Staging PR
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'

    steps:
      - name: Create or reuse promotion PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "staging";
            const headRef = "dev";
            const head = `${owner}:${headRef}`;
            const title = "chore(ci): promote dev to staging";
            const body = [
              "Automated promotion PR after `Lakira Backend CI` passed on `dev`.",
              "",
              `Source workflow run: ${context.payload.workflow_run.html_url}`,
              "",
              "Merge this PR to promote the latest `dev` changes into `staging`."
            ].join("\n");

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head,
              base,
              per_page: 100,
            });

            if (existing.length > 0) {
              core.info(`Promotion PR already open: #${existing[0].number}`);
              return;
            }

            try {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: headRef,
                base,
                body,
                maintainer_can_modify: true,
              });
              core.info(`Created promotion PR: #${created.data.number}`);
            } catch (error) {
              if (
                error &&
                typeof error === "object" &&
                "status" in error &&
                error.status === 422 &&
                String(error.message || "").includes("No commits between")
              ) {
                core.info("No new commits to promote from dev to staging.");
                return;
              }
              throw error;
            }
