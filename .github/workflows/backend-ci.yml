# .github/workflows/backend-ci.yml

name: Lakira Backend CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

defaults:
  run:
    # Update this path directly if backend code moves into a subfolder.
    working-directory: .

jobs:
  checks:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI spec consistency
        run: npm run docs:openapi:check

  security_delta:
    name: Security Delta Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lakira_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: lakira_ci
      JWT_SECRET: security-delta-ci-placeholder
      REDIS_REQUIRED: "false"
      DISABLE_RATE_LIMITING: "true"
      ENABLE_DUMMY_ENDPOINTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security framework validation tests
        run: npm run test:unit:security-framework

      - name: Run security delta checks
        run: npm run security:delta:check -- --output tmp/security/security-delta-report.json --audit-raw tmp/security/npm-audit-production.json

      - name: Evaluate soft gate policy
        id: security_gate
        continue-on-error: true
        run: npm run security:gate:evaluate -- --input tmp/security/security-delta-report.json --policy documents/security/framework/ci-gate-policy.json --output tmp/security/security-gate-result.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-delta
          path: tmp/security

      - name: Enforce security gate result
        if: steps.security_gate.outcome == 'failure'
        run: exit 1

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [checks, security_delta]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
          POSTGRES_DB: lakira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:${{ secrets.POSTGRES_PASSWORD_TEST }}@localhost:5432/lakira_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
      DB_NAME: lakira_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      DISABLE_RATE_LIMITING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations (test)
        run: npm run db:migrate:test
        # If you only have `db:migrate`, use that instead:
        # run: npm run db:migrate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Archive unit coverage output
        run: mv coverage/jest coverage/jest-unit

      - name: Run integration tests with coverage
        run: npm run test:integration:coverage

      - name: Archive integration coverage output
        run: mv coverage/jest coverage/jest-integration

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage

      # Optional: upload Jest JUnit reports if you configure them
      # - name: Upload Jest test reports
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-jest-reports
      #     path: reports/jest

  contract_local:
    name: contract_local
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
          POSTGRES_DB: lakira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:${{ secrets.POSTGRES_PASSWORD_TEST }}@localhost:5432/lakira_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_TEST }}
      DB_NAME: lakira_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      PORT: 4000
      DISABLE_RATE_LIMITING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate OpenAPI spec
        run: npm run docs:openapi:generate

      - name: Run DB migrations (contract)
        run: npm run db:migrate:test
        # Or a dedicated contract DB migration script if you add one
        # run: npm run db:migrate:contract

      - name: Start backend (test server)
        run: |
          nohup npm run start:test > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          sleep 1
          ps -p "$(cat /tmp/backend.pid)" || true
          lsof -i :4000 || true

      - name: Wait for backend health
        run: |
          wait_with_logs() {
            "$@" || {
              echo "---- backend.log (tail) ----"
              tail -n 200 /tmp/backend.log || true
              echo "--------------------------------"
              exit 1
            }
          }
          wait_with_logs npx wait-on tcp:4000 --timeout 180000
          wait_with_logs npx wait-on http://localhost:4000/api/v1/health --timeout 180000

      - name: Run contract tests (local)
        run: npm run test:contract:local

      - name: Setup Python for Schemathesis
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Schemathesis CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/contract/schemathesis/requirements.txt

      - name: Extract Schemathesis token
        id: schemathesis-token
        run: |
          TOKEN=$(node <<'NODE'
          const fs = require('fs');
          const seed = JSON.parse(fs.readFileSync('tmp/contract-seed.json','utf8'));
          if (!seed?.primaryUser?.token) {
            process.exit(1);
          }
          process.stdout.write(seed.primaryUser.token);
          NODE
          )
          echo "value=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis contract tests (local)
        env:
          SCHEMATHESIS_LOCAL_TOKEN: ${{ steps.schemathesis-token.outputs.value }}
          SCHEMATHESIS_LOCAL_BASE_URL: http://localhost:4000/api/v1
          SCHEMATHESIS_CLI: schemathesis
        run: npm run test:contract:schemathesis:local

      - name: Dump backend logs on failure
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "---- backend.log (tail) ----"
            tail -n 200 /tmp/backend.log || true
            echo "--------------------------------"
          fi

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
            rm -f /tmp/backend.pid
          fi

      - name: Upload Newman contract reports (local)
        uses: actions/upload-artifact@v4
        with:
          name: newman-contract-local
          path: tests/contract/postman-newman/reports/local

      - name: Upload Schemathesis contract reports (local)
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-contract-local
          path: tests/contract/schemathesis/reports/local

  deploy_staging:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: contract_local
    if: github.ref == 'refs/heads/staging'
    timeout-minutes: 15
    env:
      RENDER_STAGING_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
      STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }} # or a dedicated staging secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run DB migrations (staging)
        run: npm run migrate:staging:ci

      - name: Trigger staging deploy
        run: |
          if [ -z "$RENDER_STAGING_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_STAGING_DEPLOY_HOOK_URL secret is not configured."                                                                
            exit 1
          fi                                                                                                                               
          curl -X POST "$RENDER_STAGING_DEPLOY_HOOK_URL"

  contract_staging:
    name: Contract Tests (Staging Backend)
    runs-on: ubuntu-latest
    needs: deploy_staging
    if: github.ref == 'refs/heads/staging'
    timeout-minutes: 20
    env:
      NODE_ENV: test
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests (staging)
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: npm run test:contract:staging

      - name: Upload Newman contract reports (staging)
        uses: actions/upload-artifact@v4
        with:
          name: newman-contract-staging
          path: tests/contract/postman-newman/reports/staging

  deploy_production:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: contract_local
    if: github.ref == 'refs/heads/main'
    environment: production # Manual approval gate via GitHub environment protection rules
    timeout-minutes: 20
    # NOTE: RENDER_PRODUCTION_DEPLOY_HOOK_URL must be configured in GitHub repo secrets
    # before this job is usable. Without it, the deploy step will fail fast.
    #
    # Gate model: contract_staging runs only on `refs/heads/staging`, so this job
    # cannot list it under `needs:`. Instead we re-run the staging contract suite
    # against STAGING_BASE_URL as a pre-deploy probe — if staging is unhealthy or
    # the commit being promoted to main has drifted from what staging validated,
    # the production deploy aborts before migrations run.
    env:
      RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
      PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_PRODUCTION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging is healthy (contract test gate)
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "STAGING_BASE_URL secret is not configured — cannot gate production deploy on staging health."
            exit 1
          fi
          npm run test:contract:staging

      - name: Upload pre-deploy contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-contract-pre-production
          path: tests/contract/postman-newman/reports/staging

      - name: Build
        run: npm run build

      - name: Run DB migrations (production)
        run: npm run migrate:production:ci

      - name: Trigger production deploy
        run: |
          if [ -z "$RENDER_PRODUCTION_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_PRODUCTION_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi
          curl -X POST "$RENDER_PRODUCTION_DEPLOY_HOOK_URL"
